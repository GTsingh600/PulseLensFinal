# PROVISIONAL starting values, used only until calibration on set A genuine sessions replaces them (SPEC 10, M2.6,
# M4.2). They are physics-based guesses, not measurements: every result that uses them carries
# threshold_source "bootstrap" and is shown with the PROVISIONAL THRESHOLDS label (CLAUDE.md rules 3 and 4).
# Change them only on evidence from gates G1/G2, and record why in docs/STATUS.md under Decisions.

echo:
  a_min: 0.003            # smallest projection on the pulse colour direction (chromaticity units) that counts as an echo

optical.light.delay:
  center_ms: 150          # middle of typical browser camera latency
  tolerance_ms: 150       # pass band 0 to 300 ms until profiles are calibrated

optical.face_neck:
  center_ms: 0            # the flash reaches face and neck in the same frame
  scale_ms: 20            # one score unit of face-vs-neck lag
  ratio_center: 1.0       # face echo amplitude / neck echo amplitude
  ratio_log_tolerance: 1.386   # ln 4: skin and shirt reflect differently, so up to 4x either way scores nothing
  ratio_log_scale: 0.693       # ln 2 per score unit beyond that
  tau: 3.0                # = calibration.provisional_tau in config.yaml
  min_pairs: 3            # pulses with both echoes needed to judge
  min_snr: 2.0            # an echo is timed only when its amplitude is at least 2x its own threshold (8 sigma)
  neck_min_coverage: 0.5  # share of the neck box inside the frame
  saturation: 0.95        # linear channel mean above which the neck is clipped

# Camera reality (SPEC 9.2). Physics and literature bounds, far from both the G1 webcam (fingerprint PCE 459-1567,
# mid-grey noise sigma ~0.007 linear) and synthetic video (PCE ~0, noise ~0). Calibration replaces them.
camera.timing:
  max_gap_ms: 1000        # a stall longer than this is a source that stopped, not a camera
camera.duplicates:
  max_share: 0.05         # exact repeats of the previous frame
  min_frames: 30
camera.noise_curve:
  min_noise_mid: 0.0015   # temporal noise sigma at mid-grey (linear) below which the video is too clean for a sensor
camera.fingerprint:
  min_pce: 50             # PCE between odd- and even-frame fingerprints; PRNU work treats ~60 as a match
camera.modes:
  fov_tolerance: 0.05     # relative change of scale that counts as "the view moved"
camera.claim_mismatch:
  low_noise_mid: 0.002    # "perfectly clean": below this noise ...
  low_timing_cv: 0.01     # ... and below this frame-interval spread
  fps_over_claim: 1.2     # or measured fps above 1.2x the claimed rate

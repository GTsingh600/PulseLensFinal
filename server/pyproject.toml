[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pulselens"
version = "0.1.0"
description = "Camera-first liveness layer for video-KYC (hackathon prototype)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7,<3",
    "python-multipart>=0.0.9",  # multipart frame batches (SPEC 6)
    "pyyaml>=6.0",
    "numpy>=1.26",
    # Vision (track B). mediapipe pins opencv-contrib-python, so that is the one cv2 we use: a second
    # opencv package (e.g. -headless) would overwrite the same cv2 module.
    "mediapipe>=0.10.20,<0.11",
    "opencv-contrib-python>=4.9",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx2>=2.15", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pulselens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

<g class="coral"><rect x="207" y="298" width="119" height="26" rx="4" stroke-width="0.5"/><text class="ts" x="266.5" y="311" text-anchor="middle" dominant-baseline="central">Flicker filter</text></g>

<rect class="col" x="346" y="210" width="135" height="254" rx="8" stroke-width="0.5"/>
<text class="th" x="413.5" y="230" text-anchor="middle" dominant-baseline="central">Same as neck?</text>
<text class="ts" x="413.5" y="248" text-anchor="middle" dominant-baseline="central">Surface physics</text>
<g class="teal"><rect x="354" y="266" width="119" height="26" rx="4" stroke-width="0.5"/><text class="ts" x="413.5" y="279" text-anchor="middle" dominant-baseline="central">Echo vs neck</text></g>
<g class="coral"><rect x="354" y="298" width="119" height="26" rx="4" stroke-width="0.5"/><text class="ts" x="413.5" y="311" text-anchor="middle" dominant-baseline="central">Split cheeks</text></g>
<g class="coral"><rect x="354" y="330" width="119" height="26" rx="4" stroke-width="0.5"/><text class="ts" x="413.5" y="343" text-anchor="middle" dominant-baseline="central">Noise, sharpness</text></g>
<g class="coral"><rect x="354" y="362" width="119" height="26" rx="4" stroke-width="0.5"/><text class="ts" x="413.5" y="375" text-anchor="middle" dominant-baseline="central">Eye glint</text></g>
<g class="coral"><rect x="354" y="394" width="119" height="26" rx="4" stroke-width="0.5"/><text class="ts" x="413.5" y="407" text-anchor="middle" dominant-baseline="central">Pulse (lab only)</text></g>

<rect class="col" x="493" y="210" width="135" height="254" rx="8" stroke-width="0.5"/>
<text class="th" x="560.5" y="230" text-anchor="middle" dominant-baseline="central">Holds up?</text>
<text class="ts" x="560.5" y="248" text-anchor="middle" dominant-baseline="central">Stress tests</text>
<g class="coral"><rect x="501" y="266" width="119" height="26" rx="4" stroke-width="0.5"/><text class="ts" x="560.5" y="279" text-anchor="middle" dominant-baseline="central">SBI seams</text></g>
<g class="coral"><rect x="501" y="298" width="119" height="26" rx="4" stroke-width="0.5"/><text class="ts" x="560.5" y="311" text-anchor="middle" dominant-baseline="central">MiniFASNet</text></g>
<g class="coral"><rect x="501" y="330" width="119" height="26" rx="4" stroke-width="0.5"/><text class="ts" x="560.5" y="343" text-anchor="middle" dominant-baseline="central">Turn identity</text></g>
<g class="coral"><rect x="501" y="362" width="119" height="26" rx="4" stroke-width="0.5"/><text class="ts" x="560.5" y="375" text-anchor="middle" dominant-baseline="central">Vibration shake</text></g>
<g class="coral"><rect x="501" y="394" width="119" height="26" rx="4" stroke-width="0.5"/><text class="ts" x="560.5" y="407" text-anchor="middle" dominant-baseline="central">Hand occlusion</text></g>

<line x1="340" y1="480" x2="340" y2="506" class="arr" marker-end="url(#arrow)"/>

<rect class="box" x="40" y="508" width="600" height="108" rx="12" stroke-width="0.5"/>
<text class="th" x="56" y="530" dominant-baseline="central">Decide</text>
<g class="teal"><rect x="52" y="546" width="104" height="56" rx="4" stroke-width="0.5"/><text class="th" x="104" y="566" text-anchor="middle" dominant-baseline="central">Thresholds</text><text class="ts" x="104" y="584" text-anchor="middle" dominant-baseline="central">Provisional</text></g>
<g class="teal"><rect x="170" y="546" width="104" height="56" rx="4" stroke-width="0.5"/><text class="th" x="222" y="566" text-anchor="middle" dominant-baseline="central">Results</text><text class="ts" x="222" y="584" text-anchor="middle" dominant-baseline="central">Lab only</text></g>
<g class="coral"><rect x="288" y="546" width="104" height="56" rx="4" stroke-width="0.5"/><text class="th" x="340" y="566" text-anchor="middle" dominant-baseline="central">Planner</text><text class="ts" x="340" y="584" text-anchor="middle" dominant-baseline="central">Per device</text></g>
<g class="coral"><rect x="406" y="546" width="104" height="56" rx="4" stroke-width="0.5"/><text class="th" x="458" y="566" text-anchor="middle" dominant-baseline="central">Fusion</text><text class="ts" x="458" y="584" text-anchor="middle" dominant-baseline="central">Calibrated LR</text></g>

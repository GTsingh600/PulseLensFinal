<text class="it" x="52" y="887"><tspan style="font-weight:700;fill:#0F6E56">Data boundaries:</tspan> no heart rate stored · video stays in the bank's V-CIP recording · decisions only server-side · data stays in India · no third-party detection APIs</text>
<text class="it" x="52" y="912"><tspan style="font-weight:700;fill:#993C1D">Not yet measured for India:</tspan> budget phones · tube lights · skin tones · languages · live face swaps</text>

<svg xmlns="http://www.w3.org/2000/svg" width="680" height="840" viewBox="0 0 680 840" role="img">
<title>PulseLens architecture and build status</title>
<desc>Browser capture feeds a self-hosted server that asks four questions: real camera, live scene, same surface as the neck, holds up under stress. Results go to a decide layer and five outcomes. Teal is built, coral dashed is not built, grey dashed is not yet measured for India.</desc>
<style>
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
.th { font-size: 14px; font-weight: 600; fill: #2C2C2A; }
.ts { font-size: 12px; fill: #5F5E5A; }
.box { fill: #F7F6F2; stroke: #B4B2A9; }
.col { fill: #FFFFFF; stroke: #D3D1C7; }
.teal rect { fill: #E1F5EE; stroke: #0F6E56; }
.teal .th, .teal .ts { fill: #085041; }
.coral rect { fill: #FAECE7; stroke: #993C1D; stroke-dasharray: 4 3; }
.coral .th, .coral .ts { fill: #712B13; }
.dash { stroke-dasharray: 4 3; }
.arr { stroke: #888780; stroke-width: 1.5; fill: none; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="840" fill="#FFFFFF"/>

<rect class="box" x="40" y="40" width="600" height="104" rx="12" stroke-width="0.5"/>
<text class="th" x="56" y="62" dominant-baseline="central">Capture in the customer's browser, no app</text>
<g class="teal"><rect x="52" y="80" width="104" height="40" rx="4" stroke-width="0.5"/><text class="ts" x="104" y="100" text-anchor="middle" dominant-baseline="central">Camera probe</text></g>
<g class="teal"><rect x="170" y="80" width="104" height="40" rx="4" stroke-width="0.5"/><text class="ts" x="222" y="100" text-anchor="middle" dominant-baseline="central">Exposure lock</text></g>
<g class="teal"><rect x="288" y="80" width="104" height="40" rx="4" stroke-width="0.5"/><text class="ts" x="340" y="100" text-anchor="middle" dominant-baseline="central">Random flash</text></g>
<g class="coral"><rect x="406" y="80" width="104" height="40" rx="4" stroke-width="0.5"/><text class="ts" x="458" y="100" text-anchor="middle" dominant-baseline="central">Split flash</text></g>
<g class="coral"><rect x="524" y="80" width="104" height="40" rx="4" stroke-width="0.5"/><text class="ts" x="576" y="100" text-anchor="middle" dominant-baseline="central">Vibration</text></g>

<line x1="340" y1="144" x2="340" y2="170" class="arr" marker-end="url(#arrow)"/>

<rect class="box" x="40" y="172" width="600" height="308" rx="12" stroke-width="0.5"/>
<text class="th" x="56" y="194" dominant-baseline="central">Analysis server, self-hosted in India, stores no pulse</text>

<rect class="col" x="52" y="210" width="135" height="254" rx="8" stroke-width="0.5"/>
<text class="th" x="119.5" y="230" text-anchor="middle" dominant-baseline="central">Real camera?</text>
<text class="ts" x="119.5" y="248" text-anchor="middle" dominant-baseline="central">Camera family</text>
<g class="teal"><rect x="60" y="266" width="119" height="26" rx="4" stroke-width="0.5"/><text class="ts" x="119.5" y="279" text-anchor="middle" dominant-baseline="central">Mode switch</text></g>
<g class="teal"><rect x="60" y="298" width="119" height="26" rx="4" stroke-width="0.5"/><text class="ts" x="119.5" y="311" text-anchor="middle" dominant-baseline="central">Noise curve</text></g>

<g class="teal"><rect x="60" y="362" width="119" height="26" rx="4" stroke-width="0.5"/><text class="ts" x="119.5" y="375" text-anchor="middle" dominant-baseline="central">Frame timing</text></g>
<g class="teal"><rect x="60" y="394" width="119" height="26" rx="4" stroke-width="0.5"/><text class="ts" x="119.5" y="407" text-anchor="middle" dominant-baseline="central">Duplicates</text></g>
<g class="teal"><rect x="60" y="426" width="119" height="26" rx="4" stroke-width="0.5"/><text class="ts" x="119.5" y="439" text-anchor="middle" dominant-baseline="central">Device rules</text></g>

